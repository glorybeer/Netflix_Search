name: KMRB Netflix 데이터 자동 수집

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      resume_movies:
        description: '영화 수집 재개 페이지 번호 (비워두면 자동)'
        required: false
      resume_tv:
        description: 'TV 수집 재개 페이지 번호 (비워두면 자동)'
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Python 3.10 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 의존성 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: 데이터 수집 스크립트 실행
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          KMRB_API_KEY: ${{ secrets.KMRB_API_KEY }}
          RESUME_MOVIES: ${{ github.event.inputs.resume_movies }}
          RESUME_TV: ${{ github.event.inputs.resume_tv }}
        run: python collector.py
      
      - name: 변경사항 확인
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Git 설정
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
      
      - name: 변경사항 커밋 및 푸시
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add kmrb_full_dataset.json collection_progress.json
          git commit -m "chore: 영등위 Netflix 데이터셋 업데이트 [$(date +'%Y-%m-%d %H:%M:%S UTC')]"
          git push
      
      - name: 작업 완료 보고서
        run: |
          echo "## 📊 데이터 수집 완료 보고서" >> $GITHUB_STEP_SUMMARY
          echo "**상태**: 수집 완료" >> $GITHUB_STEP_SUMMARY
          echo "**시간**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**업데이트된 파일**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`kmrb_full_dataset.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`collection_progress.json\`" >> $GITHUB_STEP_SUMMARY
